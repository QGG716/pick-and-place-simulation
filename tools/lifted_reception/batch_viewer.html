<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>M710 顶层连续规划回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131d29;color:#e7f0fa;font:14px system-ui,'Microsoft Yahei',sans-serif}header{height:70px;padding:12px 20px;border-bottom:1px solid #35495d}h1{font-size:20px;margin:0 0 6px}small{color:#aac2d5}main{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 70px)}aside{background:#192839;padding:18px;overflow:auto}button,select{background:#29445b;color:#eef8ff;border:1px solid #57788f;border-radius:5px;padding:7px;margin:3px;cursor:pointer}input{width:100%;accent-color:#63d5db}#view{position:relative;overflow:hidden}canvas{display:block}#hud{position:absolute;left:14px;bottom:14px;background:#102031e8;padding:10px 14px;line-height:1.55;border-radius:6px;pointer-events:none}#source{position:absolute;left:14px;top:12px;color:#f4d59c;font-size:12px;background:#102031ba;padding:5px}pre{font-size:11px;white-space:pre-wrap;word-break:break-word;line-height:1.6}.muted{color:#adbfce;font-size:12px;line-height:1.7}#error{color:#ff8989}h3{font-size:14px;color:#8ce1e6;margin-top:20px}
</style>
<header><h1>FANUC M-710 · 顶层连续抓放</h1><small>同一批次末态衔接 · 原生关节轨迹 + 联动几何 + 名义下落 · 非物理执行</small></header>
<main><aside><button id="play">▶ 连续播放</button><button id="reset">回到开头</button><input id="seek" type="range" min="0" step=".01"><div id="clock"></div><h3>实际完成</h3><div id="counts"></div><h3>当前阶段</h3><pre id="detail"></pre><button id="iso">三维</button><button id="front">正视</button><button id="side">侧视</button><h3>当前路径指标</h3><pre id="quality"></pre><h3>时间口径</h3><pre id="timing"></pre><h3>证据范围</h3><div class="muted">机器人和吸具：本轮原生 q 驱动。<br>机构：同源几何；仅回放本次记录中的升降，展示时间不代表硬件速度。<br>释放后：初速为零、姿态固定、g=9.81 的名义下落。<br>IDEAL_RECEIVER_DRAIN：安全分离后的显式清空假设，不代表真实出料。<br>NOT_EVALUATED / NOT_RUN<br>continuous_swept_proof=false<br>execution_ready=false</div><pre id="identity"></pre><div id="error"></div></aside><div id="view"><div id="source"></div><div id="hud"></div></div></main>
<script>/*__VENDOR__*/</script><script>
const D=/*__DATA__*/;
if(D.joint_search){document.title='M710 固定布局联合搜索回放';document.querySelector('h1').textContent='FANUC M-710 · 固定布局连续卸箱';document.querySelector('header small').textContent='单一已接受分支 · 按各周期已核验的撤离、停靠与出料顺序回放 · 非物理执行';document.querySelector('.muted').textContent='名义下落、理想输送。完整箱体以 ≤5 mm 步长检查完整机器人/工具；出料期间机器人保持该周期已核验的等待 q。可先在释放处等待，或在箱体静止时先撤离、停靠，再等待出料。箱体全包络越过 X=-3.2 m 后才提交完成。升降展示速度不代表硬件速度。physical_execution=NOT_RUN；非连续扫掠证明。';}
const T=THREE,$=id=>document.getElementById(id),mat=a=>new T.Matrix4().set(...a.flat()),vec=a=>new T.Vector3(...a);
if(D.single_junction){document.title='M710 c00 · 交汇区 Hmin 单箱回放';document.querySelector('h1').textContent='FANUC M-710 · c00 交汇区 Hmin 单箱';document.querySelector('header small').textContent=`c01 已提交末态 → 本轮新增 ${D.result.completed_count}/1 · ${D.incomplete_run?'未完成：仅显示独立候选的已检查前缀':'名义接收与理想清空'} · 非物理执行`;}
if(D.all_remaining){document.title='M710 | 剩余箱体续跑';document.querySelector('h1').textContent='FANUC M-710 | 本轮完整抓放 '+D.result.completed_count+'/'+D.result.target_count;document.querySelector('header small').textContent='本轮原生轨迹 · 名义接收与理想清空 · 物理执行 NOT_RUN';}
if(D.assumed_removed_target_ids?.length){document.querySelector('header small').textContent+=' · 假定已移走 '+D.assumed_removed_target_ids.join(', ')+'（不计成功）';}
if(D.planning_diagnostic){const rates=D.planning_diagnostic.ignored_check==='PILZ_ALL_JOINT_VELOCITY_ACCELERATION_DECELERATION';document.title='M710 | 单列运动限制实验';document.querySelector('header small').textContent='仅 l05_c03 '+(rates?'忽略六关节速度/加减速度限制':'忽略J4速度限制')+' · 其余箱保留原限制 · 历史 '+D.historical_completed_count+' 箱 · 非物理执行';}
if(D.mount_comparison){document.title='M710 | 安装位置对照';document.querySelector('h1').textContent='FANUC M-710 | '+D.mounting_variant+' · '+D.segments[0].target;document.querySelector('header small').textContent='独立单箱试验 · 本次原生轨迹 · 名义接收与理想清空 · 物理执行 NOT_RUN';}
const scene=new T.Scene();scene.background=new T.Color('#172536');
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);$('view').appendChild(renderer.domElement);
const camera=new T.PerspectiveCamera(43,1,.01,100);camera.up.set(0,0,1);const controls=new T.OrbitControls(camera,renderer.domElement);
scene.add(new T.HemisphereLight(0xcceeff,0x58616e,1.0));const light=new T.DirectionalLight(0xffffff,.55);light.position.set(-4,-5,7);scene.add(light);
if(D.single_junction){const evidence=D.junction_evidence,region=evidence.receive_policy_check?.reception||evidence.option.reception;
 const polygon=region.influence_polygon_world_xy_m,origin=[Math.max(...polygon.map(p=>p[0]))-.02,(Math.min(...polygon.map(p=>p[1]))+Math.max(...polygon.map(p=>p[1])))/2,evidence.option.H_receive_m+.035];
 scene.add(new T.ArrowHelper(vec(region.outfeed_direction_world),vec(origin),.5,0x64e2ed,.10,.06));}
const meshes=[],assets={};for(const [key,a] of Object.entries(D.model.meshes)){const bytes=Uint8Array.from(atob(a.positions_b64),x=>x.charCodeAt(0));assets[key]=new Float32Array(bytes.buffer);}
for(const item of D.model.links){let g;if(item.kind==='mesh'){g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(assets[item.asset],3));g.computeVertexNormals();}else if(item.kind==='box')g=new T.BoxGeometry(...item.size);else{g=new T.CylinderGeometry(item.radius,item.radius,item.length,20);g.rotateX(Math.PI/2);}let mesh=new T.Mesh(g,new T.MeshStandardMaterial({color:item.tool?0xc89cdd:0xe9c744,roughness:.6}));mesh.matrixAutoUpdate=false;scene.add(mesh);meshes.push({mesh,item});}
function solidGeometry(b){if(!b.solid)return new T.BoxGeometry(...(b.size||b.half_extents_m.map(x=>2*x)));const g=new T.BufferGeometry(),v=b.solid.vertices_m,xyz=[];for(const f of b.solid.faces)for(let i=1;i<f.length-1;i++)for(const k of [f[0],f[i],f[i+1]])xyz.push(...v[k]);g.setAttribute('position',new T.Float32BufferAttribute(xyz,3));g.computeVertexNormals();return g;}
const cartonIds=new Set(D.segments[0].cartons.map(b=>b.id));const bodies=new Map();function body(b,color,opacity=1){let mesh=bodies.get(b.id);if(!mesh){mesh=new T.Mesh(solidGeometry(b),new T.MeshStandardMaterial({color,roughness:.8,transparent:opacity<1,opacity,depthWrite:opacity>=1}));mesh.matrixAutoUpdate=false;scene.add(mesh);bodies.set(b.id,mesh);}mesh.visible=true;mesh.matrix.copy(mat(b.pose));mesh.material.color.setHex(color);mesh.material.opacity=opacity;return mesh;}
function robot(q,delta=[0,0,0]){const frames={world:new T.Matrix4().makeTranslation(...delta)};let pending=[...D.model.joints];for(let n=0;n<D.model.joints.length+1&&pending.length;n++)pending=pending.filter(j=>{if(!frames[j.parent])return true;let f=frames[j.parent].clone().multiply(mat(j.origin));if(j.type==='revolute'||j.type==='continuous'){let k=D.model.joint_names.indexOf(j.name);f.multiply(new T.Matrix4().makeRotationAxis(vec(j.axis),k<0?0:q[k]));}frames[j.child]=f;return false;});for(const {mesh,item} of meshes)mesh.matrix.copy(frames[item.link].clone().multiply(mat(item.origin)));return frames;}
function interpolate(points,t){let i=0;while(i+1<points.length&&points[i+1].t<t)i++;const a=points[i],b=points[Math.min(i+1,points.length-1)];const u=b.t===a.t?0:Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t)));return a.q.map((x,k)=>x+(b.q[k]-x)*u);}
let time=0,playing=false,last=0;
function draw(t){time=Math.max(0,Math.min(D.duration,t));const s=D.segments.find(x=>time<x.start+x.duration)||D.segments.at(-1);const local=Math.min(s.duration,time-s.start);for(const mesh of bodies.values())mesh.visible=false;
 let baseDelta=s.base_delta_m||[0,0,0];
 if(s.kind==='base_xy'){const path=s.base_path;let i=0;while(i+1<path.length&&path[i+1].t<local)i++;const a=path[i],b=path[Math.min(i+1,path.length-1)],u=b.t===a.t?0:Math.max(0,Math.min(1,(local-a.t)/(b.t-a.t)));baseDelta=a.delta_m.map((v,k)=>v+u*(b.delta_m[k]-v));}
 const q=s.kind==='motion'?interpolate(s.points,local):s.q,frames=robot(q,baseDelta);let key=s.world,height;
 if(s.kind==='lift'){const k=Math.min(s.heights.length-1,Math.round(local/s.duration*(s.heights.length-1)));key=s.heights[k].world;height=s.heights[k].height;}
 const world=D.worlds[key];if(height===undefined){const belt=world.find(b=>b.id==='conveyor_transverse');height=belt.pose[2][3]+belt.size[2]/2;}
 for(const original of world){let b=original;if(s.kind==='base_xy'&&b.id==='mount_plinth'){b=structuredClone(b);for(let k=0;k<3;k++)b.pose[k][3]+=baseDelta[k]-s.base_delta_m[k];}const mechanism=b.category==='lift_mechanism';body(b,mechanism?0xe6a548:b.category==='conveyor'?0x489bb7:0x617e90,b.category==='trailer'?.06:b.category==='floor'?.20:1);}
 const attached=(s.kind==='motion'||s.kind==='lift')&&!!s.attachment;let targetBox=null;
 for(const b of s.cartons){if(b.id===s.target&&(attached||s.kind==='drop'||s.kind==='outfeed'||s.landed))continue;body(b,b.id===s.target?0xffc16b:0xb38c58,.92);}
 if(attached){targetBox=structuredClone(s.attachment);const pose=frames.flange.clone().multiply(mat(targetBox.pose));targetBox.pose=[[pose.elements[0],pose.elements[4],pose.elements[8],pose.elements[12]],[pose.elements[1],pose.elements[5],pose.elements[9],pose.elements[13]],[pose.elements[2],pose.elements[6],pose.elements[10],pose.elements[14]],[0,0,0,1]];body(targetBox,0xffbd69);}
 if(s.kind==='drop'){targetBox=structuredClone(s.drop.samples[0].box);targetBox.pose[2][3]-=.5*9.81*local*local;body(targetBox,0xffbd69);}
 if(s.landed){targetBox=s.landed;body(targetBox,0xffbd69);}
 if(s.kind==='outfeed'){const samples=s.outfeed.samples;let j=1;while(j<samples.length-1&&samples[j].t<local)j++;const a=samples[j-1],b=samples[j],u=Math.max(0,Math.min(1,(local-a.t)/(b.t-a.t)));targetBox=structuredClone(a.box);for(let k=0;k<3;k++)targetBox.pose[k][3]=a.box.pose[k][3]+u*(b.box.pose[k][3]-a.box.pose[k][3]);body(targetBox,0xffbd69);}
 const processLabel=({FRONT_DIRECT_HMIN:'正抓直出 / Hmin',FRONT_DIRECT_HMAX:'正抓直出 / Hmax',FRONT_LATERAL_HMIN:'正抓横移 / Hmin',LEFT_INNER_HMIN:'左内侧 / Hmin',RIGHT_INNER_HMAX:'右内侧 / Hmax'})[s.option.template]||'—';
 const phaseLabel=({pregrasp:'接近',contact:'接触',top_lift:'顶吸抬箱',top_transfer:'顶吸 −X 转移',extraction:'抽离',withdrawal:'撤离',residence:'空载停靠'})[s.phase]||s.phase;
 const nominal=s.completed+(s.kind==='landed'||s.kind==='outfeed'||(s.kind==='motion'&&(s.phase==='withdrawal'||s.phase==='residence'))?1:0);
 $('hud').innerHTML=`<b>${(D.single_junction||D.all_remaining)?'本轮新增':'顶层'} ${s.completed}/${D.result.target_count}</b> · ${s.target||'任务结束'}<br>${phaseLabel} · 回放 ${time.toFixed(1)} s<br>附着 ${attached?'是':'否'} · 吸盘 ${attached||s.phase==='contact'?(s.commanded_count+' / 72 命令'):'关闭'}<br>名义接收 ${nominal} · 理想清空 ${s.completed} · 实测接收 0`;
 $('source').textContent=D.incomplete_run?`未接受候选 ${D.candidate_folder} · ${D.integration_failure?'IK 后程序异常；未检查目标碰撞':'未生成接近轨迹'}`:'规划回放 · 非物理执行';
 $('seek').value=time;$('clock').textContent=`${time.toFixed(1)} / ${D.duration.toFixed(1)} s`;
 $('counts').textContent=`${(D.single_junction||D.all_remaining)?'本轮新增':'顶层'} ${s.completed}/${D.result.target_count} · 保留下层 ${D.lower_count}`+(D.single_junction?` · 历史完成 ${D.historical_completed_count} · 现场 ${D.initial_carton_count-s.completed} 箱`:'');
 if(D.all_remaining)$('counts').textContent=`本轮 ${s.completed}/${D.result.target_count} · 历史 ${D.historical_completed_count} · 现场 ${D.initial_carton_count-s.completed} 箱`;
 if(D.xy_base_continuation){$('counts').textContent=`累计规划 ${s.completed}/40 · 本次新增 ${Math.max(0,s.completed-31)} · 现场 ${40-s.completed} 箱`;$('hud').innerHTML=$('hud').innerHTML.replace('本轮新增','累计规划');if(s.kind==='base_xy')$('hud').innerHTML=$('hud').innerHTML.replace('任务结束','空载平移');}
 if(D.assumed_removed_target_ids?.length)$('counts').textContent+=` · 假定移除 ${D.assumed_removed_target_ids.length} 箱（不计成功）`;
 if(D.mount_comparison){$('counts').textContent=`本格独立试验 ${s.completed}/1 · 初态历史 ${D.historical_completed_count} · 现场 ${D.initial_carton_count-s.completed} 箱`;$('hud').innerHTML=$('hud').innerHTML.replace('顶层','本格');}
 $('detail').textContent=`${s.target||'—'}\n${s.option.template||'—'}\nH=${height.toFixed(3)} m\n${s.phase}\n${s.source}`;
 if(D.xy_base_continuation)$('detail').textContent+='\n基座世界坐标 ['+D.initial_base_world_m.map((v,k)=>(v+baseDelta[k]).toFixed(3)).join(', ')+'] m';
 if(D.geometry_variant){const g=D.geometry_variant;
  $('detail').textContent+=g.transverse_support_spacing_to_m!==undefined?
   `\n横带剪叉 X 中心距 ${g.transverse_support_spacing_from_m.toFixed(2)} → ${g.transverse_support_spacing_to_m.toFixed(2)} m\n含支脚总宽 ${g.transverse_support_outer_width_from_m.toFixed(2)} → ${g.transverse_support_outer_width_to_m.toFixed(2)} m · 纵带保留 ${g.to_width_m.toFixed(2)} m`:
   `\n纵带宽度 ${g.from_width_m.toFixed(2)} → ${g.to_width_m.toFixed(2)} m · Ymin 保持`;
 }
 if(D.single_junction&&!D.incomplete_run){const e=D.junction_evidence,o=e.option;
 $('detail').textContent+=`\n\n最终完整接受方案（非搜索试演）\nH_current 起始 ${o.H_current_m.toFixed(3)} m\nH_temporary ${o.H_temporary_m.toFixed(3)} m\nH_receive ${o.H_receive_m.toFixed(3)} m\n当前实际带高 ${height.toFixed(3)} m\n交汇区 · 出料 −X · 吸具工作轴 +X\n同步 ${e.receive_sync_location}\n抽离起点带高 ${e.actual_extraction_height_m.toFixed(3)} m\n名义落差 ${D.times.nominal_drop_distance_m.toFixed(3)} m\n第三种同步方案已禁用\n首次触带箱顶 ${e.first_touch_tool_geometry.box_top_m.toFixed(3)} m\n相关工具下缘净高 ${e.first_touch_tool_geometry.outfeed_vertical_envelope_gap_m?.toFixed(3)??'不适用'} m\n失败及候选轨迹见独立候选查看器`;}
 if(D.incomplete_run){const o=D.junction_evidence.option;
 $('detail').textContent+=`\n\n失败候选 ${D.candidate_folder} · 最终未接受\nH_current 已提交 ${o.H_current_m.toFixed(3)} m\nH_temporary 候选 ${o.H_temporary_m.toFixed(3)} m\nH_receive 要求 ${o.H_receive_m.toFixed(3)} m\n候选显示带高 ${height.toFixed(3)} m\n交汇区 · 出料 −X · 工作轴 +X\n拟同步位置 ${o.synchronization}\n实际 pregrasp/contact 同步：未到达\n抽离/释放/触带/分离/清空：未到达\n设计名义落差 ${D.frozen_height.low_drop_m.toFixed(3)} m；本轮未释放\n第三种同步方案已禁用\n已提交场景始终 ${D.initial_carton_count} 箱、${o.H_current_m.toFixed(3)} m\n${D.unsearched_label||'未搜索高度/同步选项'} ${D.unsearched_options}\n${typeof D.failure_detail==='string'?D.failure_detail:D.failure_detail?.reason||''}\n失败 q 及原生拒绝证据见候选查看器`;}
 $('quality').textContent=s.quality?`${s.planner_id}\n实际起点 q: ${s.q_start.map(x=>x.toFixed(4)).join(', ')}\n实际终点 q: ${s.q_goal.map(x=>x.toFixed(4)).join(', ')}\nJ1–J6 累计 rad: ${s.quality.cumulative_abs_joint_rad.map(x=>x.toFixed(3)).join(', ')}\n等权 L1 ${s.quality.weighted_joint_length_rad.toFixed(3)} rad\nTCP ${s.quality.tcp_length_m.toFixed(3)} m\n接触坐标 ${s.quality.physical_contact_length_m.toFixed(3)} m\n机器人运动 ${s.quality.motion_duration_s.toFixed(3)} s\n原生请求计算 ${s.quality.planning_wall_s.toFixed(3)} s`:'该阶段未汇总路径指标';
 window.previewState={time,phase:s.phase,completed_count:s.completed,carton_count:[...bodies.entries()].filter(([id,m])=>m.visible&&cartonIds.has(id)).length,
   q_rad:q,flange_matrix_column_major:frames.flange.elements.slice(),height_m:height,attached,nominal_count:nominal,drain_count:s.completed,physical_count:0,target:s.target,target_pose:targetBox?.pose,
   base_delta_m:baseDelta,base_xyz_world_m:D.initial_base_world_m?.map((v,k)=>v+baseDelta[k]),
   continuous:true,physical_execution:'NOT_RUN'};
 renderer.render(scene,camera);
}
function resize(){const w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
function iso(){camera.position.set(-5.8,-5.8,4.2);controls.target.set(-.75,0,1.25);controls.update();}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'▶ 连续播放';};$('reset').onclick=()=>{playing=false;draw(0);};$('seek').max=D.duration;$('seek').oninput=()=>{playing=false;draw(Number($('seek').value));};
$('iso').onclick=iso;$('front').onclick=()=>{camera.position.set(-6.2,0,2.8);controls.target.set(-.4,0,1.45);controls.update();};$('side').onclick=()=>{camera.position.set(-1.6,-6.2,2.9);controls.target.set(-.9,0,1.3);controls.update();};
function sideCloseup(){const first=D.segments[0],b=first.cartons.find(b=>b.id===first.target),seam=D.junction_evidence?.option.reception?.inlet_edge_world[0][0]??-.9,x=(b.pose[0][3]+seam)/2,z=b.pose[2][3]-.15,y=b.pose[1][3];camera.position.set(x,y-3.1,z+.10);controls.target.set(x,y,z);controls.update();}
if(D.single_junction){$('side').textContent='侧视近景';$('side').onclick=sideCloseup;}
$('timing').textContent=`规划耗时 ${D.result.planning_wall_s.toFixed(2)} s\n机器人轨迹 ${D.times.native_trajectory_s.toFixed(2)} s\n机构演示 ${D.times.lift_demo_s.toFixed(2)} s\n名义下落 ${D.times.nominal_drop_s.toFixed(3)} s\n事件展示 ${D.times.event_display_s.toFixed(1)} s\n硬件完整周期：未知`;
$('identity').textContent=`seed ${D.seed}\nsource ${D.source_commit}`;
window.addEventListener('resize',resize);window.addEventListener('error',e=>$('error').textContent=e.message);window.setBatchTime=draw;window.batchData=D;window.resizeBatch=resize;window.setBatchSideCloseup=sideCloseup;
resize();iso();draw(0);function tick(now){requestAnimationFrame(tick);if(playing){draw(time+Math.min(.1,(now-last)/1000));if(time>=D.duration)playing=false;}last=now;controls.update();renderer.render(scene,camera);}requestAnimationFrame(tick);
</script></html>
