<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>两次现场规划失败 · 保存证据回看</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a25;color:#e5edf5;font:14px/1.5 system-ui,'Noto Sans CJK SC',sans-serif}header{padding:14px 22px;border-bottom:1px solid #38485a}h1{font-size:21px;margin:0}small,.muted{color:#a8bacd}main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 88px)}aside{overflow:auto;padding:18px;background:#172435}select,button{width:100%;background:#23364c;color:#f0f5fa;border:1px solid #50647b;border-radius:5px;padding:9px;margin:5px 0;font:inherit}input[type=range]{width:100%}img{width:100%;border-radius:5px}label{display:block;margin:12px 0 3px;color:#b9ccde}#reason{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;background:#101a25;border-left:3px solid #ed7c73}#view{position:relative;min-width:0}canvas{display:block}#hud{position:absolute;left:16px;top:16px;padding:12px;background:#101a25e8;max-width:80%;pointer-events:none}#error{color:#ff969c;white-space:pre-wrap}.buttons{display:flex;gap:7px}#stats{color:#f2c883}#meta{font-variant-numeric:tabular-nums;white-space:pre-wrap}.legend{position:absolute;bottom:18px;left:18px;padding:10px;background:#101a25e8;pointer-events:none}a{color:#8ed9ec}</style>
<header><h1>两次现场规划失败 · 保存证据回看</h1><small>纯离线显示 · 原始 RGB-D 与对应候选记录 · 没有完整可执行计划 · 没有实际运动</small></header>
<main><aside><label>现场箱位</label><select id="case"></select><div id="stats"></div><img id="image"><small>绿色：同帧分割区域；三维黄色箱体包含推断部分。</small>
<label>候选编号（全部保留）</label><select id="candidate"></select><div id="reason"></div>
<label>保存的姿态 / 局部原生输出</label><select id="mode"></select><input id="sample" type="range" min="0" value="0"><div id="meta"></div>
<p class="muted">原生输出尚不等于通过完整发送路径审计。滑块仅切换保存的采样姿态，不补画缺失路径。搜索超时不证明物理无解。</p>
<label><input id="collision" type="checkbox"> 显示完整碰撞实体</label><label><input id="environment" type="checkbox" checked> 显示实测现场障碍</label>
<div class="buttons"><button id="overview">全景</button><button id="focus">目标局部</button></div><p class="muted">左键旋转 · 滚轮缩放 · 右键平移<br>红色：记录所指的碰撞部件 / 障碍；机器人和吸具使用现有 CAD。未导入历史仿真环境。</p><div id="error"></div></aside>
<div id="view"><div id="hud"></div><div class="legend">黄：完整箱体包络　蓝灰：现场障碍　青：原生输出 TCP 采样线（未认证）</div></div></main>
<script>/*__VENDOR__*/</script><script>
const DATA=/*__DATA__*/;window.FIELD_FAILURE_DATA=DATA;
const $=id=>document.getElementById(id),T=THREE,model=DATA.model,view=$('view');let active,chosen,modes=[],q,pair=[];
window.onerror=(m)=>{$('error').textContent=m;};
const matrix=a=>new T.Matrix4().set(...a.flat());
const scene=new T.Scene();scene.background=new T.Color('#101a25');const camera=new T.PerspectiveCamera(43,1,.002,30);camera.up.set(0,0,1);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));view.prepend(renderer.domElement);const controls=new T.OrbitControls(camera,renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x314357,.9));const light=new T.DirectionalLight(0xffffff,.9);light.position.set(-2,-3,4);scene.add(light,new T.AxesHelper(.15));
function fk(q){const f={world:new T.Matrix4()};let pending=model.joints.slice();while(pending.length){const next=[];for(const j of pending){if(!f[j.parent]){next.push(j);continue;}let m=f[j.parent].clone().multiply(matrix(j.origin));const i=model.joint_names.indexOf(j.name);if(i>=0)m.multiply(new T.Matrix4().makeRotationAxis(new T.Vector3(...j.axis).normalize(),q[i]));f[j.child]=m;}if(next.length===pending.length)throw Error('FK tree unresolved');pending=next;}return f;}
function decode(s,type){const raw=atob(s),b=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);return new type(b.buffer);}
const cache={};function geometry(item){if(item.kind==='box')return new T.BoxGeometry(...item.size);if(item.kind==='cylinder'){let g=new T.CylinderGeometry(item.radius,item.radius,item.length,24);g.rotateX(Math.PI/2);return g;}if(!cache[item.asset]){const a=model.meshes[item.asset],g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(decode(a.positions_b64,Float32Array),3));g.setIndex(new T.BufferAttribute(decode(a.indices_b64,Uint32Array),1));g.computeVertexNormals();cache[item.asset]=g;}return cache[item.asset];}
function mesh(g,color,alpha=1,wireframe=false){const o=new T.Mesh(g,new T.MeshStandardMaterial({color,transparent:alpha<1,opacity:alpha,depthWrite:alpha===1,wireframe,side:T.DoubleSide}));o.matrixAutoUpdate=false;return o;}
const robot=model.links.map(item=>{let o=mesh(geometry(item),item.rgb?new T.Color(...item.rgb):item.tool?0xa7bdcc:0xd9e3ec,item.layer==='collision'?.22:1,item.layer==='collision');scene.add(o);return {item,o,color:o.material.color.clone()};});
let world=[],line=null;
function draw(){renderer.render(scene,camera);}
function pose(q0,p=[]){q=q0;pair=p;const frames=fk(q);for(const r of robot){r.o.matrix.copy(frames[r.item.link]).multiply(matrix(r.item.origin));r.o.visible=r.item.layer==='visual'||$('collision').checked;r.o.material.color.copy(pair.includes(r.item.id)?new T.Color(0xff455f):r.color);}for(const r of world){r.o.visible=r.target||$('environment').checked;r.o.material.color.set(pair.includes(r.id)?0xff455f:r.target?0xe8b45b:0x8298ad);r.o.material.opacity=pair.includes(r.id)?.8:r.target?.7:.1;if(r.target){const a=modes[Number($('mode').value)]?.attachment;r.o.matrix.copy(a?frames[model.flange_link].clone().multiply(matrix(a.pose)):matrix(active.box.pose));}}draw();}
function focus(target=false){const center=target?new T.Vector3(...active.box.pose.slice(0,3).map(r=>r[3])):new T.Vector3(-.22,0,.32);const d=target?.55:1.9;camera.position.copy(center).add(new T.Vector3(-.8,-1.4,.8).normalize().multiplyScalar(d));controls.target.copy(center);controls.update();draw();}
function option(el,text,value){const o=document.createElement('option');o.textContent=text;o.value=value;el.append(o);}
function sample(){const m=modes[Number($('mode').value)],i=Number($('sample').value);pose(m.q[i],m.pair||[]);$('meta').textContent=`保存采样 ${i+1}/${m.q.length}\nJ(°)：${q.map(v=>(v*180/Math.PI).toFixed(2)).join('  ')}`+(m.note?'\n'+m.note:'');}
function mode(){const m=modes[Number($('mode').value)];$('sample').max=m.q.length-1;$('sample').value=0;if(line){scene.remove(line);line.geometry.dispose();line.material.dispose();line=null;}if(m.tcp){line=new T.Line(new T.BufferGeometry().setFromPoints(m.tcp.map(p=>new T.Vector3(...p))),new T.LineBasicMaterial({color:0x5acde0}));scene.add(line);}sample();}
function candidate(){chosen=active.candidates[Number($('candidate').value)];$('reason').textContent=chosen.reason;modes=[{label:'实测 q_start',q:[active.q_start],note:'冻结实测起点'}];for(const s of chosen.states){const f=s.failure;let detail='终态检查未报告碰撞；不代表路径通过';if(f){const gap=f.surface_distance_m;detail=gap<0?'相交/接触；负值为原生状态码，非穿入深度':`表面间隙 ${(gap*1000).toFixed(3)} mm；要求 ${(f.required_pair_clearance_m*1000).toFixed(1)} mm`;}modes.push({label:s.label+(f?' · 拒绝':' · 已检查'),q:[s.q],pair:f?.pair,attachment:s.attachment,note:detail});}for(const p of chosen.paths)modes.push({label:`${p.stage} · ${p.name}`,q:p.q,tcp:p.tcp,attachment:p.attachment,note:`原生输出 ${p.samples} 点，显示 ${p.displayed_samples} 点；未经完整审计\n峰值 |v|=${p.max_velocity_rad_s.toFixed(6)} rad/s，|a|=${p.max_acceleration_rad_s2.toFixed(6)} rad/s²\n来源：${p.source}`});$('mode').replaceChildren();modes.forEach((m,i)=>option($('mode'),m.label,i));const bad=modes.findIndex(m=>m.pair?.length);$('mode').value=bad>=0?bad:0;mode();}
function selectCase(){active=DATA.cases[Number($('case').value)];$('image').src=active.image;$('stats').textContent=`任务 ${active.task_id.slice(0,8)} · 失败返回 ${active.duration_s.toFixed(1)} s`;$('hud').textContent=`箱位 ${Number($('case').value)+1} · world = base_link · ${active.world.length} 个现场物体 · ${model.cup_ids.length} 杯`;
for(const r of world){scene.remove(r.o);r.o.geometry.dispose();r.o.material.dispose();}world=[];for(const b of [...active.world,{id:active.box.id,size:active.box.size_m,pose:active.box.pose}]){let g;if(b.convex_mesh){g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(b.convex_mesh.vertices.flat(),3));g.setIndex(b.convex_mesh.triangles.flat());g.computeVertexNormals();}else g=new T.BoxGeometry(...b.size);const target=b.id===active.box.id,o=mesh(g,target?0xe8b45b:0x8298ad,target?.7:.1);o.matrix.copy(matrix(b.pose));scene.add(o);world.push({o,id:b.id,target});}$('candidate').replaceChildren();active.candidates.forEach((c,i)=>option($('candidate'),`#${c.index} · ${c.kind}`,i));$('candidate').value=active.candidates.findIndex(c=>c.kind==='ENDPOINT_TOOL_OR_PAYLOAD_BLOCKED');candidate();focus();}
DATA.cases.forEach((c,i)=>option($('case'),`箱位 ${i+1} · ${c.task_id.slice(0,8)}`,i));$('case').onchange=selectCase;$('candidate').onchange=candidate;$('mode').onchange=mode;$('sample').oninput=sample;$('overview').onclick=()=>focus();$('focus').onclick=()=>focus(true);$('collision').onchange=$('environment').onchange=()=>pose(q,pair);controls.addEventListener('change',draw);
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();draw();}window.onresize=resize;selectCase();resize();window.FIELD_VIEWER_READY=true;window.fieldViewer={fk,selectCase,candidate,mode,sample,focus,get q(){return q;},get pair(){return pair;}};
</script></html>
