const position=m=>new T.Vector3().setFromMatrixPosition(m);const tcpCache=new Map();
const tcp=q=>{const key=q.join(',');if(!tcpCache.has(key))tcpCache.set(key,position(fk(q,true).m710_virtual_task_tcp));return tcpCache.get(key);};
const modelObjects=[];const robot=new T.Group();scene.add(robot);
for(const l of model.links){let g;if(l.kind==='box')g=new T.BoxGeometry(...l.size);else if(l.kind==='mesh'){const b=atob(model.meshes[l.asset].positions_b64),bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(bytes.buffer),3));g.computeVertexNormals();}else{g=new T.CylinderGeometry(l.radius,l.radius,l.length,18);g.rotateX(Math.PI/2);}const m=new T.MeshStandardMaterial({color:l.tool?(l.link.includes('cup')?0x31a9bb:0x9aafbf):0xf1c231,metalness:.22,roughness:.5});const obj=new T.Mesh(g,m);obj.matrixAutoUpdate=false;obj.userData.link=l.link;robot.add(obj);modelObjects.push([obj,l,matrix(l.origin),m.color.clone()]);}

function pose(q,detail){currentQ=q.slice();const f=fk(q);for(const [obj,l,origin,original]of modelObjects){obj.matrix.copy(f[l.link]).multiply(origin);obj.material.color.copy(original);}if(payload){payload.matrix.copy(f.flange).multiply(matrix(active.request.attachment.pose));payload.material.color.set(0xf9a35b);}for(const b of obstacles)b.material.color.set(b.userData.baseColor);if(detail){selection=detail;$('selection').textContent=detail;}const degrees=q.map(x=>x*180/Math.PI);$('jointValues').textContent=degrees.map((x,i)=>`J${i+1} ${x.toFixed(2)}°`).join('  ')+'\nq_rad: '+q.map(x=>x.toFixed(6)).join(', ')+'\ngoal q: '+(active.request.q_goal||[]).map(x=>x.toFixed(6)).join(', ');renderAngleChart();}
function renderAngleChart(){const c=$('angles'),ctx=c.getContext('2d');c.width=290;c.height=108;ctx.clearRect(0,0,c.width,c.height);const points=active?.final_timed_path||[];if(!points.length)return;let vals=points.flatMap(p=>p.q.map(v=>v*180/Math.PI));const lo=Math.min(-180,...vals),hi=Math.max(180,...vals);const pal=['#58c9ff','#ffae61','#4ce3b4','#c392ff','#ff6d88','#eae779'];ctx.font='10px system-ui';ctx.fillStyle='#93a9c4';ctx.fillText(`${hi.toFixed(0)}°`,2,10);ctx.fillText(`${lo.toFixed(0)}°`,2,104);for(let j=0;j<6;j++){ctx.strokeStyle=pal[j];ctx.beginPath();points.forEach((p,i)=>{const x=35+i*250/Math.max(1,points.length-1),y=12+(hi-p.q[j]*180/Math.PI)*86/(hi-lo);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}ctx.strokeStyle='#fff';const x=35+Number($('motion').value)*250/Math.max(1,points.length-1);ctx.beginPath();ctx.moveTo(x,10);ctx.lineTo(x,102);ctx.stroke();}
function drawGraph(){clear(graph);nodePoints=null;rejectedLines=null;drawnEvents=[];drawnNodes=[];if(!planner){const p=active?.final_timed_path||[];if(p.length>1)graph.add(line(p.map(x=>tcp(x.q)),colors.final));drawReceiverRegion();return;}const nodes=planner.nodes;const project=nodes.map(n=>tcp(n.q));const cutoff=Number($('event').value);const events=planner.events.slice(0,cutoff);const available=new Set();for(const e of events)if(e[2])available.add(JSON.stringify(e[4]));const raw=planner.raw_solution||[];const selected=new Set(raw.map(q=>JSON.stringify(q)));const pools={start:[],goal:[],unused:[]};for(const [a,b]of planner.edges){if(cutoff<planner.events.length){if(nodes[a].tree!==nodes[b].tree)continue;const child=nodes[a].tree==='START'?b:a;if(!available.has(JSON.stringify(nodes[child].q)))continue;}const key=nodes[a].tree==='START'?'start':'goal';if(!selected.has(JSON.stringify(nodes[a].q))||!selected.has(JSON.stringify(nodes[b].q))){if(!enabled.unused)continue;}pools[key].push([project[a],project[b]]);}for(const key of ['start','goal'])if(enabled[key])graph.add(segments(pools[key],colors[key],.42));

if(enabled.final&&points.length)graph.add(line(points.map(p=>tcp(p.q)),colors.final,1));

$('eventText').textContent=`事件 ${cutoff}/${planner.events.length}（原始 ${planner.total_extensions}）`;$('counts').innerHTML=`PlannerData: ${planner.planner_data_vertices} 节点 / ${planner.planner_data_edges} 边<br>当前显示：${drawnNodes.length} 节点 / ${drawnEvents.length} 拒绝扩展<br>扩展记录 ${planner.events.length}/${planner.total_extensions}，检查样本 ${planner.checked_samples.length}/${planner.total_extension_custom_checks}<br>${planner.truncated?'⚠ 记录已截断，详情见原始数据':'记录未截断'} · 简化中间路径：未取得`;
}
function drawReceiverRegion(){if(!DATA.result.through_lifted_release_ready)return;const row=DATA.result.attempts?.at(-1);const region=DATA.result.plan?.receiving_region||row?.receiving_region;for(const p of region?.polygons_world_m||[])framesGroup.add(line([...p,p[0]].map(x=>new T.Vector3(...x)),0x59e3ad,.95));for(const a of row?.region_attempts||[]){const mesh=new T.Mesh(new T.SphereGeometry(.014,12,8),new T.MeshBasicMaterial({color:a.selected?0x59e3ad:0xf07880}));mesh.position.set(...a.center_world_m);framesGroup.add(mesh);} }
function setExternal(index){const e=active.external_axis;if(!e||active.response_identity.status!=='SUCCESS')return;const fraction=Math.max(0,Math.min(1,index/100));$('motion').value=Math.round(fraction*100);const belt=obstacles.find(o=>o.userData.name===e.from.id);if(belt){const p=structuredClone(e.from.pose);p[2][3]+=(e.to.pose[2][3]-p[2][3])*fraction;belt.matrix.copy(matrix(p));}pose(e.robot_q,'外部轴几何运动 · robot_q_constant=true\n进度 '+Math.round(100*fraction)+'%\n机械臂实际同步 q 保持不变；未发生物理执行。\n'+JSON.stringify({from:e.from.pose[2][3],to:e.to.pose[2][3],check:e.check_method,mechanical_travel:e.mechanical_travel,execution_duration_s:e.execution_duration_s},null,2));$('motionText').textContent='升带几何进度 '+Math.round(100*fraction)+'% · 无硬件速度，不代表执行时间';}
function setMotion(index){if(active?.external_axis){setExternal(index);return;}const points=active.final_timed_path||[];if(!points.length){$('motionText').textContent='未生成最终轨迹';return;}index=Math.max(0,Math.min(points.length-1,index));$('motion').value=index;motionTime=points[index].t;pose(points[index].q,`最终轨迹点 ${index}/${points.length-1}\n原始 t=${points[index].t.toFixed(3)} s\n请求 ${active.response_identity.request_id}\n原生返回样本；非物理执行`);$('motionText').textContent=`点 ${index}/${points.length-1} · t=${motionTime.toFixed(3)} / ${points.at(-1).t.toFixed(3)} s`;}
function selectEvent(index){if(!planner||!planner.events.length)return;index=Math.max(0,Math.min(planner.events.length-1,index));const e=planner.events[index];$('event').value=index+1;drawGraph();const samples=planner.checked_samples.slice(e[5],e[6]),bad=samples.find(s=>!s[1]);let detail=`扩展 #${e[0]} ${e[1]===0?'START':'GOAL'} ${e[7]}\n从 q=${e[3].map(v=>v.toFixed(5))}\n尝试 q=${e[4].map(v=>v.toFixed(5))}\n原检查样本 ${samples.length}\n`;if(!e[2])detail+=bad?.[2]?JSON.stringify(bad[2],null,2):'失败见证 UNKNOWN（未提供本次原始原因）';detail+='\n没有记录有序分界，不推断安全/失败边界或碰撞点。';pose(bad?.[0]||e[4],detail);for(const valid of [true,false]){const recorded=samples.filter(s=>s[1]===valid);if(recorded.length){const g=new T.BufferGeometry().setFromPoints(recorded.map(s=>tcp(s[0])));graph.add(new T.Points(g,new T.PointsMaterial({color:valid?0x56e8a4:0xff304d,size:.045})));}}const pair=bad?.[2]?.original?.pair||[];for(const [o,l]of modelObjects)if(pair.includes(l.link))o.material.color.set(0xff304d);for(const o of obstacles)if(pair.includes(o.userData.name))o.material.color.set(0xff304d);if(payload&&pair.includes(active.request.attachment.id))payload.material.color.set(0xff304d);}
function chooseAttempt(){motionPlaying=searchPlaying=false;const choice=attempts[Number($('attempt').value)];active=choice.a;planner=choice.p;clear(world);clear(framesGroup);payload=null;obstacles=[];for(const b of active.request.world){const color=b.id===active.request.process_policy.target_id?0xf9a35b:b.category==='carton'?0xa98661:0x61758c;const o=new T.Mesh(new T.BoxGeometry(...b.size),new T.MeshStandardMaterial({color,transparent:true,opacity:Number($('opacity').value),depthWrite:false}));o.matrixAutoUpdate=false;o.matrix.copy(matrix(b.pose));o.userData={name:b.id,baseColor:color};world.add(o);obstacles.push(o);}if(active.request.attachment){const a=active.request.attachment;payload=new T.Mesh(new T.BoxGeometry(...a.size),new T.MeshStandardMaterial({color:0xf9a35b,transparent:true,opacity:.8}));payload.matrixAutoUpdate=false;world.add(payload);}const f0=fk(active.request.q_start),fg=active.request.q_goal?fk(active.request.q_goal):null;for(const [f,size]of [[f0,.23],[fg,.32]])if(f){const axes=new T.AxesHelper(size);axes.matrixAutoUpdate=false;axes.matrix.copy(f.m710_virtual_task_tcp);framesGroup.add(axes);}const face=DATA.result.attempts?.find(x=>x.target.target_id===active.request.process_policy.target_id && x.target.geometric_face_id===active.request.candidate_id?.split(':').at(-1));const target=face?.target||DATA.result.plan?.target;const preplace=face?.preplace_target||DATA.result.plan?.preplace_target;

function setStage(s){stage=s;attempts=[];for(const a of DATA.raw.attempts.filter(a=>s==='external_axis'?a.request.pipeline_id==='external_axis':a.request.stage===s&&a.request.pipeline_id!=='external_axis')){const ps=a.trace?.planners||[];if(!ps.length)attempts.push({a,p:null});for(const p of ps)attempts.push({a,p});}$('attempt').innerHTML=attempts.map((x,i)=>`<option value="${i}">尝试 ${i+1} · ${x.a.response_identity.status} · ${x.a.response_identity.request_id}</option>`).join('');$('pregrasp').classList.toggle('active',s==='pregrasp');$('transit').classList.toggle('active',s==='transit');if(attempts.length)chooseAttempt();else{$('hud').textContent=s+' NOT_REACHED';clear(graph);}}

$('pregrasp').onclick=()=>setStage('pregrasp');$('transit').onclick=()=>setStage('transit');$('attempt').onchange=chooseAttempt;
$('event').oninput=()=>{searchPlaying=motionPlaying=false;selectEvent(Number($('event').value)-1);};$('step').onclick=()=>selectEvent(Number($('event').value));$('searchPlay').onclick=()=>{motionPlaying=false;if(Number($('event').value)>=Number($('event').max))$('event').value=0;searchPlaying=!searchPlaying;};
$('motion').oninput=()=>{motionPlaying=searchPlaying=false;setMotion(Number($('motion').value));};$('point').onclick=()=>setMotion(Number($('motion').value)+1);$('motionPlay').onclick=()=>{searchPlaying=false;if(Number($('motion').value)>=Number($('motion').max))setMotion(0);motionPlaying=!motionPlaying;};
$('fullDisplay').onchange=drawGraph;
$('opacity').oninput=()=>{for(const b of obstacles)b.material.opacity=Number($('opacity').value);};
function reset(){camera.position.set(-5.3,-6.2,4.8);controls.target.set(.2,0,1.2);controls.update();}$('reset').onclick=reset;
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA.raw)],{type:'application/json'}));a.download=DATA.raw.run_id+'-full-search.json';a.click();};
renderer.domElement.addEventListener('click',event=>{const r=renderer.domElement.getBoundingClientRect();raycaster.setFromCamera(new T.Vector2((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1),camera);const hit=nodePoints?raycaster.intersectObject(nodePoints)[0]:null;if(hit){const n=drawnNodes[hit.index];pose(n.q,`真实 PlannerData 节点 ${n.id}\n树 ${n.tree} · root=${n.root}\n父子关系见完整原始 edges（目标树边方向反向）`);return;}const edge=rejectedLines?raycaster.intersectObject(rejectedLines)[0]:null;if(edge){const e=drawnEvents[Math.floor(edge.index/2)];if(e)selectEvent(e[0]);}});
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);
let last=performance.now(),searchAccumulator=0;function animate(now){requestAnimationFrame(animate);let dt=Math.min(.1,(now-last)/1000);last=now;if(searchPlaying&&planner){searchAccumulator+=dt*30;if(searchAccumulator>=1){const i=Number($('event').value);selectEvent(i);searchAccumulator=0;if(i+1>=planner.events.length)searchPlaying=false;}}if(motionPlaying&&active){if(active.external_axis){const index=Number($('motion').value)+dt*25;setExternal(index);if(index>=100)motionPlaying=false;}const p=active.external_axis?[]:active.final_timed_path||[];if(p.length){motionTime+=dt*Number($('speed').value);let i=Number($('motion').value);while(i+1<p.length&&p[i+1].t<=motionTime)i++;const t=motionTime;setMotion(i);motionTime=t;if(i===p.length-1)motionPlaying=false;}}controls.update();renderer.render(scene,camera);}
const ikRows=DATA.request_log.filter(r=>r.op==='ik');for(const [i,r]of ikRows.entries()){const option=document.createElement('option');option.value=i;option.textContent=`${r.stage} · ${r.candidate_id} · Req ${r.response?.request_id} · ${r.status}`;$('ikAttempt').append(option);}
$('ikInspect').onclick=()=>{const r=ikRows[Number($('ikAttempt').value)];if(!r)return;searchPlaying=motionPlaying=false;const compatible=active.request.scene_fingerprint===r.scene_fingerprint && JSON.stringify(active.request.attachment)===JSON.stringify(r.attachment);clear(graph);clear(framesGroup);const detail=JSON.stringify({request_id:r.response?.request_id,task_id:r.task_id,stage:r.stage,candidate_id:r.candidate_id,status:r.status,actual_ik_s:r.response?.actual_ik_s,solver_api:r.response?.solver_api,internal_attempts:r.response?.internal_attempts,q_start:r.q_start,goal_pose:r.goal_pose,solver_candidate_q:r.response?.solver_candidate_q,error_code:r.response?.error_code},null,2);if(compatible){pose(r.q_start,'IK请求实际起点（不是数值解或成功路径）\n'+detail);const a=new T.AxesHelper(.3);a.matrixAutoUpdate=false;a.matrix.copy(matrix(r.goal_pose));framesGroup.add(a);}else{$('selection').textContent='当前阶段场景不兼容；不套用其他尝试的机器人姿态。\n'+detail;}const hasTree=DATA.raw.attempts.some(a=>a.request.task_id===r.task_id&&a.request.stage===r.stage);$('counts').textContent=r.status==='SUCCESS'?'IK返回成功；对应运动尝试请在上方选择':'IK未完成；本次未生成 RRT 树';$('hud').textContent=`${DATA.label} · IK Req ${r.response?.request_id} · ${r.status} · 运动未执行`;};
window.replay={setStage,selectEvent,setMotion,setExternal,reset,get active(){return active;},get planner(){return planner;},fk(q){const f=fk(q);return Object.fromEntries(Object.entries(f).map(([k,m])=>[k,m.toArray()]));},capture(){return renderer.domElement.toDataURL('image/png');}};
try{$('identity').textContent=DATA.label+' · '+DATA.result.target_id+' · '+DATA.raw.source_commit.slice(0,12);reset();resize();setStage('pregrasp');requestAnimationFrame(animate);window.REPLAY_READY=true;}catch(e){$('error').textContent=e.stack;throw e;}
</script></html>
