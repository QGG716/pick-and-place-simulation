<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S50 · 单箱完整运动学仿真</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,'Microsoft YaHei',sans-serif;background:#0c1521;color:#dce8f2}header{height:76px;padding:14px 24px;border-bottom:1px solid #334858;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header p{margin:0;color:#91aabb;font-size:12px}main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 76px)}aside{overflow:auto;padding:16px;border-right:1px solid #334858}h2{font-size:14px;color:#8fd6ce;margin:16px 0 8px}button,select{font:inherit;background:#203447;color:#dfecf5;border:1px solid #416177;border-radius:6px;padding:7px 10px;cursor:pointer;margin:3px 2px}button.primary{background:#217a79;border-color:#54beb7}button.active{border-color:#eabb69;color:#eabb69}label{display:block;margin:6px 0}.small{font-size:12px;color:#a8bdcb}#viewport{position:relative;min-width:0}canvas{display:block}#overlay{position:absolute;bottom:25px;left:22px;border:1px solid #49677b;border-radius:8px;padding:12px 18px;background:#101b29e8;pointer-events:none;white-space:pre-line;font-size:14px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#101b29;z-index:2}#loading[hidden]{display:none}#seek{width:100%;accent-color:#79dfd0}pre{white-space:pre-wrap;font-size:11px;color:#a7bdce}table{font-size:11px;border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #2f4658;padding:5px;text-align:left}#warning{color:#ebc68a;font-size:12px}#failure{color:#ffb9a1}.row{display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:#64c5b8}@media(max-width:750px){main{grid-template-columns:240px 1fr}header{padding:10px}h1{font-size:16px}}
</style></head><body><header><div><h1>S50-2000 · 单箱完整运动学仿真</h1><p>真实 CAD 六轴链 · 原吸具 + 200 mm 延长段 · 冻结 700 mm 布局</p></div><span class="small">临时仿真约定<br>非实机 / 非动力学验收</span></header><main><aside>
<h2>任务回放</h2><div><button id="play" class="primary">播放</button><button id="pause">暂停</button><button id="reset">重播</button></div><input id="seek" type="range" min="0" max="1" step=".01" value="0" aria-label="任务时间轴"><div class="row"><span id="time">0 s</span><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value=".5">0.5×</option></select></div><div id="phases"></div><button id="nearest" hidden>横带最近记录点</button>
<h2>观察肩、肘、腕</h2><button id="all">全景</button><button id="side">侧视</button><button id="close">收拢近景</button><label><input id="axes" type="checkbox" checked> 坐标轴 / 关节轴</label><label><input id="walls" type="checkbox" checked> 车厢边界</label><label><input id="wire" type="checkbox"> 连杆线框</label><pre id="joints"></pre>
<h2>横带距离 · 阶段记录构型</h2><div id="metric"></div><p class="small">活动连杆 / 肘部 2–3 / 腕部 4–6。数值来自实际网格；是记录构型的距离，不是连续路径保证。</p>
<h2>当前仿真约定</h2><p id="warning">CAD 装配零位、临时关节范围；同轴贴合理想刚性工具连接；箱子落带与输送为运动学动画。保留全环境基本避障，未做动力学和型号认证。</p><details><summary>本轮计算记录</summary><pre id="report"></pre></details><pre id="failure"></pre>
</aside><div id="viewport"><div id="loading">正在加载真实 S50 与完整任务状态…</div><div id="overlay"></div></div></main><script>/*__VENDOR__*/</script><script>
(async()=>{'use strict';
const pack=/*__DATA__*/;const bin=atob(pack),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
const D=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const T=THREE,K=S50Kinematics,S=D.sim,P=S.samples,$=id=>document.getElementById(id),view=$('viewport');
window.S50_VIEWER_DATA=D;const scene=new T.Scene();scene.background=new T.Color('#0c1521');const camera=new T.PerspectiveCamera(40,1,.01,100);camera.up.set(0,0,1);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));view.prepend(renderer.domElement);const orbit=new T.OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;
scene.add(new T.HemisphereLight(0xe5f4ff,0x566778,1.6));for(const p of [[-3,-4,7],[2,3,5]]){const l=new T.DirectionalLight(0xffffff,1.5);l.position.set(...p);scene.add(l);}
const matrix=a=>new T.Matrix4().set(...a.flat());const meshes={},env={},tool=new T.Group(),axes=new T.Group();scene.add(tool,axes);
const colors=[0x7f95a5,0x4b8195,0xa9beca,0xd6dee2,0x65c4c8,0x76a7b5,0xc9e7e6];
function decode(text,Type){const raw=atob(text);return new Type(Uint8Array.from(raw,c=>c.charCodeAt(0)).buffer);}
for(const [i,p]of D.local_parts.entries()){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(decode(p.positions_b64,Float32Array),3));g.setIndex(new T.BufferAttribute(decode(p.indices_b64,Uint32Array),1));g.computeVertexNormals();const m=new T.Mesh(g,new T.MeshStandardMaterial({color:colors[i],metalness:.25,roughness:.47,side:T.DoubleSide}));m.matrixAutoUpdate=false;meshes[p.name]=m;scene.add(m);}
function geom(r){if(!r.solid)return new T.BoxGeometry(...r.size_m);const v=[];for(const f of r.solid.faces)for(let j=1;j<f.length-1;j++)for(const k of [f[0],f[j],f[j+1]])v.push(...r.solid.vertices_m[k]);const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.computeVertexNormals();return g;}
const records=D.environment.height_samples.find(s=>Math.abs(s.height_m-.6)<1e-9).entities;
for(const r of records){const wall=r.id.startsWith('trailer_'),carton=r.category==='carton';const m=new T.Mesh(geom(r),new T.MeshStandardMaterial({color:carton?(r.id===S.target?0xefc366:0xb89b76):wall?0x90a6b6:r.category==='conveyor'?0x277c87:0x607b8c,transparent:wall,opacity:wall?(r.id.includes('floor')?.26:.08):1,side:T.DoubleSide}));m.matrixAutoUpdate=false;m.matrix.copy(matrix(r.world_from_entity));m.userData.record=r;env[r.id]=m;scene.add(m);}
const intrinsic=D.environment.tool_intrinsic;for(const [key,color]of [['rigid_local_boxes_virtual_tcp_m',0x4d91af],['compliant_local_boxes_virtual_tcp_m',0x76e7c8]])for(const row of intrinsic[key]){const m=new T.Mesh(new T.BoxGeometry(...row.slice(3)),new T.MeshStandardMaterial({color,roughness:.55,transparent:true,opacity:key.startsWith('rigid')?.9:.78}));m.position.set(...row.slice(0,3));tool.add(m);}tool.matrixAutoUpdate=false;
const flangeAxes=new T.AxesHelper(.22),contactAxes=new T.AxesHelper(.2);flangeAxes.matrixAutoUpdate=contactAxes.matrixAutoUpdate=false;axes.add(flangeAxes,contactAxes,new T.AxesHelper(.7));const markers={};for(const j of D.model_definition.joints){const m=new T.AxesHelper(.13);m.matrixAutoUpdate=false;markers[j.child_link]=m;axes.add(m);}
const contactPlane=new T.Mesh(new T.PlaneGeometry(...D.tool_reference.contact_plane_size_m),new T.MeshBasicMaterial({color:0x85f5cc,transparent:true,opacity:.2,side:T.DoubleSide}));contactPlane.matrixAutoUpdate=false;scene.add(contactPlane);
const names={home:'初态',pregrasp:'预抓取',approach:'接近',grasp:'吸取',separate:'分离抬升',withdraw:'抽离',transfer:'转运 / 收拢',belt_raise:'横带升高',release:'释放',drop:'名义落带',exit:'退出',park:'出料避让',outfeed:'运动学输送',belt_lower:'横带下降',return:'返回',complete:'完成'};
let playing=false,time=0,last=null,index=0,lastEnv=-1;const end=P[P.length-1].time_s;$('seek').max=end;
function cameraView(kind){if(kind==='close'){camera.position.set(-4.9,-4.3,3.5);orbit.target.set(-1.3,0,1.6);}else if(kind==='side'){camera.position.set(-.8,-7,2.8);orbit.target.set(-1.1,0,1.4);}else{camera.position.set(-5.7,-6.8,4.8);orbit.target.set(-1,0,1.35);}orbit.update();}
function blend(a,b,t){const A=matrix(a),B=matrix(b),p=new T.Vector3(),q=new T.Quaternion(),s=new T.Vector3(),p2=new T.Vector3(),q2=new T.Quaternion(),s2=new T.Vector3();A.decompose(p,q,s);B.decompose(p2,q2,s2);return new T.Matrix4().compose(p.lerp(p2,t),q.slerp(q2,t),s.lerp(s2,t));}
function environment(height){const values=D.sim_environment;let i=0;while(i+1<values.length&&values[i+1].height_m<=height)i++;const a=values[i],b=values[Math.min(i+1,values.length-1)],t=b.height_m>a.height_m?(height-a.height_m)/(b.height_m-a.height_m):0;const bm=Object.fromEntries(b.entities.map(e=>[e.id,e]));for(const r of a.entities){const m=env[r.id];if(!m)continue;m.matrix.copy(blend(r.world_from_entity,bm[r.id].world_from_entity,t));if(r.solid){const attr=m.geometry.attributes.position;let k=0;for(const face of r.solid.faces)for(let j=1;j<face.length-1;j++)for(const n of [face[0],face[j],face[j+1]])for(let axis=0;axis<3;axis++)attr.array[k++]=r.solid.vertices_m[n][axis]*(1-t)+bm[r.id].solid.vertices_m[n][axis]*t;attr.needsUpdate=true;m.geometry.computeVertexNormals();}else{const scale=r.size_m.map((x,j)=>(x*(1-t)+bm[r.id].size_m[j]*t)/m.userData.record.size_m[j]);m.matrix.multiply(new T.Matrix4().makeScale(...scale));}}}
function metric(phase){const m=D.sim_closest_belt_pose?.sample_index===index?D.sim_closest_belt_pose.compactness:S.compactness.find(x=>x.phase===phase);if(!m){$('metric').textContent='此时刻没有单独的距离记录';return;}let h='<table><tr><th>集合</th><th>距离 mm</th><th>水平跨度 mm</th></tr>';for(const [key,label]of [['active_links','活动'],['elbow','肘部'],['wrist','腕部']]){const g=m.groups[key],b=g.envelope.horizontal_span_xy_m;h+='<tr><td>'+label+'</td><td>'+(g.minimum_unsigned_separation_m*1000).toFixed(1)+'</td><td>'+b.map(x=>(x*1000).toFixed(0)).join(' × ')+'</td></tr>';}$('metric').innerHTML=h+'</table>';}
function seek(t){time=Math.max(0,Math.min(end,t));index=0;while(index+1<P.length&&P[index+1].time_s<=time)index++;const a=P[index],b=P[Math.min(index+1,P.length-1)],u=b.time_s>a.time_s?(time-a.time_s)/(b.time_s-a.time_s):0,q=a.q_rad.map((x,j)=>x+(b.q_rad[j]-x)*u),frames=K.forward(D.model_definition,q,S.world_from_model_base);for(const [name,m]of Object.entries(meshes))m.matrix.copy(matrix(frames[name]));for(const [name,m]of Object.entries(markers))m.matrix.copy(matrix(frames[name]));const flange=frames.s50_flange,contact=K.multiply(flange,S.flange_from_physical_contact);tool.matrix.copy(matrix(K.multiply(flange,S.flange_from_virtual_task_tcp)));flangeAxes.matrix.copy(matrix(flange));contactAxes.matrix.copy(matrix(contact));contactPlane.matrix.copy(matrix(contact));environment(a.belt_height_m+(b.belt_height_m-a.belt_height_m)*u);const payload=a.attached?matrix(K.multiply(contact,S.physical_contact_from_attached_box)):blend(a.world_from_carton,b.world_from_carton,u);env[S.target].matrix.copy(payload);const outfed=time>=(P[S.stages.find(s=>s.phase==='outfeed')?.last_sample]?.time_s??Infinity);env[S.target].visible=!outfed;const phase=a.phase;metric(phase);$('seek').value=time;$('time').textContent=time.toFixed(1)+' / '+end.toFixed(1)+' s';$('joints').textContent='q_sim [°]\n'+q.map((v,j)=>'J'+(j+1)+'  '+(v*180/Math.PI).toFixed(1)).join('\n');$('overlay').textContent=S.target+'  ·  '+(names[phase]||phase)+'  ·  '+time.toFixed(1)+' s\n吸附 '+(a.attached?'已连接':'未连接')+'  /  有效指令杯 '+(a.attached?(S.cups?.commanded_count??0):0)+'\n名义接收 '+(time>=(P[S.stages.find(s=>s.phase==='drop')?.last_sample]?.time_s??Infinity)?1:0)+'  /  出料 '+(time>=(P[S.stages.find(s=>s.phase==='outfeed')?.last_sample]?.time_s??Infinity)?1:0);for(const button of $('phases').children)button.classList.toggle('active',button.dataset.phase===phase);window.S50_CURRENT_STATE={time_s:time,phase,q_rad:q,attached:a.attached,commanded_cup_count:a.attached?(S.cups?.commanded_count??0):0,outfed,belt_height_m:a.belt_height_m,carton_matrix:payload.toArray()};}
for(const stage of S.stages){const button=document.createElement('button');button.textContent=names[stage.phase]||stage.phase;button.dataset.phase=stage.phase;button.onclick=()=>{playing=false;seek(P[stage.last_sample].time_s);};$('phases').append(button);}
if(D.sim_closest_belt_pose){$('nearest').hidden=false;$('nearest').onclick=()=>{playing=false;seek(P[D.sim_closest_belt_pose.sample_index].time_s);cameraView('close');};}
$('play').onclick=()=>{if(time>=end)seek(0);playing=true;};$('pause').onclick=()=>playing=false;$('reset').onclick=()=>{seek(0);playing=true;};$('seek').oninput=()=>{playing=false;seek(Number($('seek').value));};$('all').onclick=()=>cameraView('all');$('side').onclick=()=>cameraView('side');$('close').onclick=()=>cameraView('close');$('axes').onchange=()=>{axes.visible=$('axes').checked;contactPlane.visible=$('axes').checked;};$('walls').onchange=()=>{for(const [name,m]of Object.entries(env))if(name.startsWith('trailer_'))m.visible=$('walls').checked;};$('wire').onchange=()=>{for(const m of Object.values(meshes))m.material.wireframe=$('wire').checked;};
$('report').textContent=JSON.stringify({status:S.status,ik_attempts:S.ik_attempts.length,collision_samples:S.collision_state_checks,source_report_sha256:D.sim_report_sha256,source_model_sha256:S.source_model_sha256,sim_timing:S.settings.timing},null,2);if(S.failure)$('failure').textContent=JSON.stringify(S.failure,null,2);
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);cameraView('all');resize();seek(0);$('loading').hidden=true;window.S50_VIEWER_READY=true;
window.s50Viewer={seek,pause(){playing=false;},play(){playing=true;},cameraView,get state(){return window.S50_CURRENT_STATE;},capture(){renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');}};
function animate(now){requestAnimationFrame(animate);if(playing&&last!==null){seek(time+(now-last)/1000*Number($('speed').value));if(time>=end)playing=false;}last=now;orbit.update();renderer.render(scene,camera);}animate(0);
})().catch(e=>{document.getElementById('loading').hidden=true;document.getElementById('failure').textContent=String(e.stack||e);window.S50_VIEWER_ERROR=String(e);});
</script></body></html>
