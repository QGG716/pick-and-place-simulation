<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>逐实例几何评审</title>
<style>body{margin:20px;background:#101822;color:#e9edf2;font:15px system-ui}a{color:#9ce}select,button{font:inherit;padding:7px;background:#263749;color:white;border:1px solid #607080}label{margin-right:15px}header{position:sticky;top:0;background:#101822;padding:10px;z-index:2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#1b2734;padding:12px;min-width:0}canvas{max-width:100%;height:auto;background:#101822;touch-action:none}.scroll{overflow:auto;max-height:680px}#image.native{max-width:none}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}table{border-collapse:collapse}td,th{padding:7px;border:1px solid #456}small{color:#bdc8d2}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
<header><a href="../../index.html">← 全部输入</a> · <a href="sam_review.html">检测 / SAM 完整提示与失败记录</a><h2 id="heading"></h2><select id="instance"></select> <button id="prev">上一实例</button> <button id="next">下一实例</button><p id="status"></p></header>
<div class="grid"><section class="panel"><h3>原始图像与同坐标叠加</h3><select id="view"><option value="rgb">原始 RGB</option><option value="depth">注册深度：0.5–4.5 m</option><option value="sam" selected>检测黄框 + SAM 绿轮廓</option><option value="initial">初始面支持点</option><option value="final">最终可靠面</option></select><p><label><input type="checkbox" id="gt">蓝色 GT 评价轮廓</label><label><input type="checkbox" id="native">原生像素</label></p><div class="scroll"><canvas id="image"></canvas></div><p>黄色始终为基础提示框；不以白色 mask 外接框替换。深度黑色只表示当前显示范围或无效值，请以原始数组为准。</p></section>
<section class="panel"><h3>米制三维 · 拖动旋转 / 滚轮缩放</h3><label><input type="checkbox" id="initial3d">初始支持点</label><label><input type="checkbox" id="rejected">红色拒绝候选（诊断）</label><button id="reset">重置视角</button><canvas id="space" width="820" height="620"></canvas><p>相机光学坐标：X 右、Y 下、Z 前，XYZ 同一米制比例。单面和不完整结果仅显示观测面片；完整体仅在深度独立验证通过时显示，GT 精度单独报告。支持点只为显示作确定性抽样。</p><pre id="evidence"></pre></section></div>
<section class="panel"><h3>本实例阶段记录</h3><pre id="details"></pre><details><summary>未匹配真值与无 mask 检测（全部保留）</summary><pre id="unmatched"></pre></details><details><summary>原始拟合与边界证据 JSON</summary><pre id="raw"></pre></details></section>
<script src="geometry_review_data.js"></script><script>
const D=window.GEOMETRY,$=id=>document.getElementById(id),choice=$('instance');
$('heading').textContent=D.name+' / '+D.module+' — '+D.capture_id;
D.instances.forEach((r,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`mask ${r.mask_id} · proposals ${r.proposal_ids.join(',')} · ${r.reliable_planes} 面 · ${r.cuboid_status}`;choice.append(o)});
$('unmatched').textContent=JSON.stringify({unmatched_gt:D.unmatched_gt,proposals_without_mask:D.proposals_without_mask,stages:D.stages},null,2);
const rgb=new Image(),depth=new Image();rgb.src=D.rgb;depth.src=D.depth;rgb.onload=draw;depth.onload=draw;
const colors=['#4ceba6','#ffb84d','#ad92ff','#f586d1','#65d8ff','#f2e989'];let yaw=.5,pitch=-.35,zoom=1,drag;
function current(){return D.instances[Number(choice.value)||0]}
function poly(ctx,points,color,width=3){if(!points.length)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.stroke()}
function draw(){let r=current();if(!r)return;let c=$('image'),ctx=c.getContext('2d');[c.width,c.height]=D.source_size;c.classList.toggle('native',$('native').checked);let mode=$('view').value,img=mode==='depth'?depth:rgb;if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0);
 if(mode!=='rgb'&&mode!=='depth'){for(const p of r.proposals){let b=p.actual_prompt?.base_bbox||p.bbox;ctx.strokeStyle='#ffe600';ctx.lineWidth=3;ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);ctx.font='24px system-ui';ctx.fillStyle='#ffe600';ctx.fillText(`${p.proposal_id} box ${p.detector_score?.toFixed(3)}`,b[0],Math.max(25,b[1]-5));if(mode==='sam')for(const curve of p.contours)poly(ctx,curve,'#25ff75',2)}
 if(mode==='initial')for(const cloud of r.initial_cloud){ctx.fillStyle=colors[cloud.label%colors.length];for(const p of cloud.pixels||[])ctx.fillRect(p[0]-2,p[1]-2,4,4)}
 if(mode==='final')r.record.camera_facing_faces.forEach((f,i)=>poly(ctx,f.corners_2d,colors[i%colors.length],4));}
 if($('gt').checked)for(const curve of r.gt_contours)poly(ctx,curve,'#398dff',3);draw3d();}
function draw3d(){let r=current();if(!r)return;const c=$('space'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let faces=r.record.camera_facing_faces.map((f,i)=>({points:f.corners_3d_m,color:colors[i%colors.length]}));
 const cubeEdges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];let cubes=[];
 if(r.record.accepted&&r.record.cuboid_status==='ACCEPTED_INDEPENDENTLY_VALIDATED')cubes.push({points:r.record.corners_3d,color:'#f6d566'});
 if($('rejected').checked&&r.record.rejected_cuboid_candidate?.corners_3d)cubes.push({points:r.record.rejected_cuboid_candidate.corners_3d,color:'#ff5365'});
 let clouds=$('initial3d').checked?r.initial_cloud:[],all=[...faces.flatMap(f=>f.points),...clouds.flatMap(q=>q.points),...cubes.flatMap(q=>q.points)];if(!all.length){ctx.fillStyle='white';ctx.fillText('无可靠表面；未生成完整体',30,50);return}
 let low=[0,1,2].map(k=>Math.min(...all.map(p=>p[k]))),high=[0,1,2].map(k=>Math.max(...all.map(p=>p[k]))),center=low.map((v,i)=>(v+high[i])/2);
 const extent=Math.max(...high.map((v,i)=>v-low[i]),.03),scale=Math.min(c.width,c.height)*.7/extent*zoom;
 function transform(p){let [x,y,z]=p.map((v,i)=>v-center[i]);let u=Math.cos(yaw)*x+Math.sin(yaw)*z,w=-Math.sin(yaw)*x+Math.cos(yaw)*z;return [c.width/2+scale*u,c.height/2+scale*(Math.cos(pitch)*y-Math.sin(pitch)*w),Math.sin(pitch)*y+Math.cos(pitch)*w]}
 for(const cloud of clouds){ctx.fillStyle=colors[cloud.label%colors.length];for(const p of cloud.points){let q=transform(p);ctx.fillRect(q[0],q[1],2,2)}}
 faces.sort((a,b)=>b.points.reduce((s,p)=>s+transform(p)[2],0)-a.points.reduce((s,p)=>s+transform(p)[2],0));for(const f of faces){let q=f.points.map(p=>transform(p).slice(0,2));ctx.globalAlpha=.25;ctx.fillStyle=f.color;ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();ctx.globalAlpha=1;poly(ctx,q,f.color,2)}
 for(const box of cubes){ctx.strokeStyle=box.color;ctx.lineWidth=2;for(const [a,b] of cubeEdges){ctx.beginPath();ctx.moveTo(...transform(box.points[a]).slice(0,2));ctx.lineTo(...transform(box.points[b]).slice(0,2));ctx.stroke()}}
 ctx.fillStyle='#ddd';ctx.font='16px system-ui';ctx.fillText(`同尺度 XYZ · 视域 ${extent.toFixed(3)} m · ${r.record.accepted?'完整体已验证':'体积 UNKNOWN / 阻断执行'}`,20,25);
}
function select(){let r=current();if(!r)return;$('status').textContent=`初始 ${r.initial_components} 个连通面片 → 最终 ${r.final_patches} 面片 / ${r.reliable_planes} 个不同平面；${r.cuboid_status}`;$('evidence').textContent=JSON.stringify({plane:r.record.plane_fit_status,multiface:r.record.multiface_relation_status,cuboid:r.record.cuboid_status,independent:r.record.independent_geometry_validation_status,source_ambiguous:r.source_ambiguous},null,2);$('details').textContent=JSON.stringify({proposal_ids:r.proposal_ids,before:r.before,evaluation:r.evaluation},null,2);$('raw').textContent=JSON.stringify({initial:r.initial,final:r.record},null,2);if(r.complete_gt_accuracy_pass===false){$('status').textContent+=' | GT 独立精度未达标';$('status').style.color='#ff6875'}else{$('status').style.color=''}draw()}
for(const id of ['view','gt','native','initial3d','rejected'])$(id).onchange=draw;choice.onchange=select;$('prev').onclick=()=>{choice.value=Math.max(0,+choice.value-1);select()};$('next').onclick=()=>{choice.value=Math.min(D.instances.length-1,+choice.value+1);select()};$('reset').onclick=()=>{yaw=.5;pitch=-.35;zoom=1;draw3d()};
$('space').onpointerdown=e=>{drag=[e.clientX,e.clientY];e.target.setPointerCapture(e.pointerId)};$('space').onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw3d()}};$('space').onpointerup=()=>drag=null;$('space').onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));draw3d()};select();
</script></html>
