extends: fanuc_m20id35_wantai_task_space.yaml

# Bounded offline search for a centre carton whose first conveyor release IK
# is reachable but whose transfer sweep conflicts with the wrist. The final
# task profile will retain only the generally useful candidate-search policy.
planning:
  max_place_pose_candidates: 12
  max_feasible_place_iks: 6
  target_planning_time_limit_seconds: 900.0
  candidate_planning_time_limit_seconds: 450.0
