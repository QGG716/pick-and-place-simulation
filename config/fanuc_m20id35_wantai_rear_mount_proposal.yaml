# cross conveyor reachable, but the present cold planner still needs a
# collision-checked trailer-door channel primitive before a full path exists.
planning:
  place_obstacle: conveyor_cross_deck
  place_obstacles: [conveyor_cross_deck]
  positive_y_place_obstacle: conveyor_cross_deck
  floor_interior_place_obstacle: conveyor_cross_deck
  max_place_pose_candidates: 12
  place_ik_budget_seconds: 30.0
  place_ik_random_restarts: 2
  place_ik_max_iterations: 140

amr:
  conveyor_front_overhang: 1.05
  robot_mount_position: [-1.15, 0.30, 0.30]
