name: ROS 2 Humble acceptance

on:
  push:
    branches: [feat/v0.5-perception-ros2]
  pull_request:

jobs:
  humble-amd64:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y python3-pip python3-pytest python3-colcon-common-extensions python3-rosdep
          rosdep update
      - name: Install lightweight contracts and core test dependencies
        run: |
          python3 -m pip install ./packages/unloading_contracts
          python3 -m pip install -e '.[dev]'
          python3 -c 'import sys, rclpy, unloading_contracts; assert sys.version_info[:2] == (3, 10); assert unloading_contracts.__version__ == "1.0.0"'
      - name: Core and integration tests
        run: python3 -m pytest -q --basetemp "$RUNNER_TEMP/pytest"
      - name: Build and test Humble workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
          colcon build --symlink-install
          source install/setup.bash
          colcon test
          colcon test-result --verbose
