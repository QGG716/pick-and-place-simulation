name: ROS 2 Humble acceptance

on:
  push:
    branches: [feat/v0.5-perception-ros2]
  pull_request:

jobs:
  humble-amd64:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y python3-pip python3-venv python3-pytest python3-colcon-common-extensions python3-rosdep
          rosdep update
      - name: Build and smoke-test install artifacts outside the source tree
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          RUN_ID=github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
          ARTIFACT_ROOT="$RUNNER_TEMP/acceptance" \
          PYTHON_BIN=/usr/bin/python3.10 \
          bash tools/run_install_artifact_smoke.sh
      - name: Core and integration tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          VENV="$RUNNER_TEMP/core-venv"
          /usr/bin/python3.10 -m venv "$VENV"
          "$VENV/bin/python" -m pip install pip==25.2 setuptools==79.0.1 wheel==0.45.1
          "$VENV/bin/python" -m pip install ./packages/unloading_contracts
          "$VENV/bin/python" -m pip install -e '.[dev]'
          "$VENV/bin/python" -m pytest -q --basetemp "$RUNNER_TEMP/pytest" \
            --junitxml "$RUNNER_TEMP/acceptance/core-pytest.xml"
      - name: Build and test Humble workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
          colcon build --symlink-install
          source install/setup.bash
          colcon test --return-code-on-test-failure
          colcon test-result --verbose
      - name: Upload install and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humble-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/acceptance
            ros2_ws/log
            ros2_ws/build/**/pytest.xml
