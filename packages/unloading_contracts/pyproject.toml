[build-system]
requires = ["setuptools>=68,<80", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unloading-contracts"
version = "1.1.0"
description = "ROS- and backend-neutral contracts for unloading perception, planning, and execution"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
