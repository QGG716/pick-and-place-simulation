schema_version: robot_load_case_v1
robot:
  model: fanuc_m20id_35
  limits_config: ../robots/fanuc_m20id_35.yaml
tool:
  config: ../tools/unloading_gripper_10kg.yaml
box:
  # Local order is depth, width, height. The origin is the front-face centre.
  size_xyz_m: [0.500, 0.400, 0.350]
  mass_kg: 25.0
  grasp_face: front_center
  grasp_point_xyz_m: [0.0, 0.0, 0.0]
  estimated_com_xyz_m: [0.250, 0.0, 0.0]
motion:
  linear_acceleration_m_s2: 1.0
  angular_acceleration_rad_s2: 1.0
  safety_factor: 1.0
