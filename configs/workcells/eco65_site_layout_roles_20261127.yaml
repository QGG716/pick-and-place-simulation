# Part roles and lift mechanism of the user's site layout STEP revision
# "layout 20261127.stp" (2026-11-27, SHA-256 0b5be70827083977...): robot moved
# from CAD -X to +X (user: "主要把机械臂从左边挪到了右边"), inclined belt and
# its rails moved 0.30 m to CAD -X, BAS01 belts swapped, cartons and the old
# mast bodies removed, a 30 L compressor added. Frame, panels and lift plates
# are unchanged, so the rules and regions of v1 (2026-11-20/21) still apply. Shared by the simulation scene and the
# real-site static layer. Rules are evaluated in order; the first match wins.
# Every part that matches no rule stays a FIXED obstacle (never dropped).
schema: eco65_site_layout_roles_v1
source_sha256: 0b5be708270839778d12ec01b6f17eb9fc5d33f43d057886a190836e3b95b65c
cad_frame: "STEP millimetres, normalised to metres; CAD +Y up, carton stack towards CAD -Z"
mechanism_basis: >-
  USER_CONFIRMED_2026_11_21: one actuated lift DOF (scissor top plate height
  h). The top plate carries the BAS01 belts and the lower hinge of the BEZ01
  L1000 inclined belt; the upper hinge rides passively on HG30 rails along
  CAD Z. The robot base is fixed to the frame beam, not to the lift.

# Roles that never become layout obstacles, each with its replacement.
excluded_roles:
  CARTON: "Movable objects. Simulation: initial carton set; real site: RGB-D measured only."
  ROBOT_LINK: "Duplicate of the official ECO65-B URDF links, which own robot collision."
  ROBOT_CAMERA_MAST: "Duplicate of assets/mast (camera mast on link_1, moves with J1)."
  TOOL: "Duplicate of the suction tool CAD (assets/tools), attached to the flange."

rules:
  - {role: CARTON, name: '^箱子模型$', basis: "CAD name 箱子模型; 48 bodies 200x200x200 mm"}
  - {role: ROBOT_LINK, name: '^(11|22|55|66|000|liangan3|liangan4)$', basis: "Robot link bodies above 机械臂底面连接座, chained from base Y 678 mm to the flange"}
  - {role: ROBOT_LINK, name: '^\^ECO65-B_robot_model\(2\)_ECO65-B_robot_model$', basis: "Named ECO65-B robot model body between links 66 and the tool"}
  - {role: ROBOT_LINK, region_mm: [[150, 745, -600], [235, 755, -585]], basis: "Unnamed zero-thickness sheet (layout_part_644, 67x0x3 mm at CAD Y 751) on top of CAD body 11; v1 exported it as root/1/2 body named 11 (robot link), this export lost the name"}
  - {role: ROBOT_CAMERA_MAST, name: '^(支撑杆|底板)\.stp$', basis: "Rod 443 mm and plate 128x74x20 mm match assets/mast (452 mm, 128x74x20 mm part); plate joins link 22"}
  - {role: TOOL, name: 'KVGL180-130', basis: "Suction tool assembly KVGL180-130-260909-01 (FG42S cups, VQ/VP valves, E3Z sensor)"}
  - {role: BELT_INCLINED, name: 'BEZ01', basis: "BEZ01-B210-L1000 belt, its motor and fasteners; rotates about the lower hinge"}
  - {role: BELT_SLIDER, name: '^(转轴2|轴承座|滑块连接板|31010069\.stp)$|QHH30C', basis: "Upper hinge, its seats, slider plates and QHH30C carriages on the HG30 rails"}
  - {role: LIFT_TOP, name: '顶板|BAS01|剪叉机端|^转轴$|转向带支架', basis: "Top plate and everything mounted on it (BAS01 belts, lower hinge, turning-belt brackets)"}
  # Remaining bodies by position (CAD mm). Containment is of the whole analytic AABB.
  - {role: LIFT_TOP, region_mm: [[-300, 340.0, -1125], [370, 480, -795]], basis: "Bodies in the lift footprint reaching no lower than 340 mm: on the top plate (Y 366.8-376.8) or fastened through it from below (fasteners <= 25 mm)"}
  - {role: LIFT_INTERIOR, region_mm: [[-300, 40.0, -1125], [370, 367.5, -795]], basis: "Scissor arms, pins, drive, screw, sensors and fasteners between the plates"}

mechanism:
  lower_hinge: '^转轴$'        # two coaxial bodies; axis = line through their AABB centres (CAD X)
  upper_hinge: '^转轴2$'
  rail: 'HG30'                 # fixed HG30 rails; slider travel diagnostic only
  base_plate: 'YLYJ-JC00-01'   # top face bounds the interior envelope from below
  top_plate: 'YLYJ-JC00-07'    # underside bounds the interior envelope from above
  lift_axis_cad: [0, 1, 0]
  # Machine lift travel, shared by simulation and the real site. Field files may
  # only tighten it. The runtime h is still a field input with its own basis.
  lift_range:
    measure: OVERALL_HEIGHT_BASE_PLATE_BOTTOM_TO_TOP_PLATE_TOP
    overall_height_mm: [160, 300]
    basis: "USER_2026_11_21: lift travel is the largest top-to-base plate distance, 160-300 mm (replaces the earlier 150-500 mm); CAD pose is 346 mm, above the range"


# CAD metres -> base_link, from tools/fit_site_layout_robot_base.py (2026-11-27):
# ICP of the official base_link.STL to CAD body '11' (layout_part_286), seed 0,
# 20000 samples; RMS 0.90 mm, p95 1.57 mm, max 2.82 mm.
# CAD design geometry only, not a field measurement.
cad_robot_base:
  T_base_cad:
    - [-0.000160, -0.000044, 1.000000, 0.632953]
    - [1.000000, -0.000182, 0.000160, -0.191771]
    - [0.000182, 1.000000, 0.000044, -0.678000]
    - [0.0, 0.0, 0.0, 1.0]
  basis: "ICP fit of official base_link.STL to CAD body 11 of layout 20261127; RMS 0.90 mm, p95 1.57 mm; CAD design geometry, not field measurement"
