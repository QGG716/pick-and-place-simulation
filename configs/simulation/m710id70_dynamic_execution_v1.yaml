schema: m710id70_dynamic_execution_v1
layout_validation_config: ../validation/m710id70_layout_v1.yaml
motion_policy_config: ../validation/m710id70_layout_v1_single_carton.yaml
dynamics_config: m710id70_official_dynamics_v2.yaml
robot_cad_manifest: ../../assets/robots/fanuc_m710id_70/official/provenance.yaml
tool_cad_manifest: ../../assets/grippers/shanghai_wantai_three_zone/asset_manifest.yaml

physics_boundary_patches:
  # Retained only as a legacy fallback.  The active layout now supplies one
  # closed, shared CPU/Isaac development trailer boundary set.
  extent_basis: layout_trailer_boundaries_with_reachable_patch_fallback
  robot_reach_m: 2.104
  task_tcp_extension_m: 0.250
  thickness_m: 0.050

replay:
  controller_period_s: 0.020
  motion_limit_scale: 0.50
  pre_grasp_controller_settle_s: 0.20
  vacuum_establish_s: 0.30
  release_hold_s: 0.10
  # Independent of the receiver-support wait.  The verified withdrawal needs
  # 0.8774 s from release to restore the unchanged 20.2 mm cup/target margin;
  # The actual conveyor-start interlock, not this timer, gates belt motion.
  release_clearance_wait_s: 1.00
  post_release_settle_s: 3.00
  normal_time_scale: 1.0
  output_width_px: 1920
  output_height_px: 1080
  output_fps: 30
  camera_mode: fixed_overview_with_contact_and_place_keyframes
  command_mode: initialize_once_then_force_limited_position_drive_targets
  camera:
    # Rendering-only world coordinates.  The centreline view keeps both
    # trailer solver walls out of the near field while showing robot, stack
    # and both conveyor legs; it never changes collision or qualification.
    eye_m: [-3.8, 0.0, 2.7]
    target_m: [-0.2, 0.0, 1.25]
    horizontal_fov_rad: 1.3089969389957472
    horizontal_aperture_mm: 20.955
    near_m: 0.03
    far_m: 10.0

qualification:
  require_complete_collision_checked_motion_plan: true
  require_robot_per_link_cad_visuals: true
  require_robot_per_link_cad_collisions: true
  require_tool_dynamic_collision_qualification: true
  require_resolved_j3_coupling: true
  require_resolved_tool0_clocking: true
  require_real_base_mounting_extent: true
  allow_proxy_collision_for_execution: false
  allow_carton_pose_teleport_after_initialization: false
  allow_joint_pose_reset_after_initialization: false
  allow_infinite_drive_or_attachment_limits: false
