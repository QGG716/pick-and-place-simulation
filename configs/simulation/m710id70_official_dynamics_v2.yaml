  constraint_type: fixed_joint_from_actual_relative_pose
  enforce_vacuum_force_capacity: false
  enforce_vacuum_break_force: false
  enforce_vacuum_break_torque: false
  max_attachment_gap_m: 0.002
  max_contact_penetration_m: 0.0002
